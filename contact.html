<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Contact Us | TechNova</title>
    <meta name="description" content="Contact TechNova to discuss your technology project and service requirements.">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>Contact TechNova</h1>

    </header>

    <nav aria-label="Main navigation">

        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>

    </nav>

    <main>

    <section>
        <h2>Contact TechNova</h2>

        <p>
            Get in touch with our team to discuss your technology needs.
        </p>
    </section>

    <section>
        <h2>Contact Information</h2>

        <address>
            <p>Email: info@technova.example</p>
            <p>Phone: +94 11 234 5678</p>
            <p>Location: Colombo, Sri Lanka</p>
        </address>
    </section>

    <section>
        <h2>Send Us a Message</h2>

        <form action="#" method="post">

    <p>
        <label for="name">Full Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
            minlength="2"
        >
    </p>

    <p>
        <label for="email">Email Address:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >
    </p>

    <p>
        <label for="phone">Phone Number:</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
        >
    </p>

    <p>
        <label for="service">Select a Service:</label>
        <select id="service" name="service" required>
            <option value="">-- Select a service --</option>
            <option value="web-development">Web Development</option>
            <option value="mobile-development">Mobile App Development</option>
            <option value="cloud-solutions">Cloud Solutions</option>
            <option value="it-consulting">IT Consulting</option>
        </select>
    </p>

    <p>
        <label for="subject">Subject:</label>
        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Enter your subject"
            required
        >
    </p>

    <p>
        <label for="message">Your Message:</label>
        <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Write your message here"
            required
            minlength="10"
        ></textarea>
    </p>

    <p>
        <button type="submit">Send Message</button>
        <button type="reset">Clear Form</button>
    </p>

    </form>


    </section>

</main>

    <footer>

        <p>&copy; 2026 TechNova. All rights reserved.</p>

    </footer>

</body>

</html>
